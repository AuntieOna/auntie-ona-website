<!doctype html>
<html lang="en-GB" data-mode="play">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess My Sorting Rule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f3f4f1; --group: #c9cfbf; --groupline: #b4bba7; --frame: #7d8572; --card: #fff8f1;
    --ink: #2f3a3a; --soft: #5d6656; --yes: #6aa860; --no: #d9826a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e6e8e2; touch-action: manipulation; }
  body { font-family: "Fredoka", system-ui, sans-serif; color: var(--ink); }

  /* fixed 1920 x 1080 frame, scaled to fit any screen */
  .frame { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; background: var(--page); transform-origin: center; overflow: hidden; }
  .logo { position: absolute; top: 26px; left: 36px; width: 230px; }
  .topright { position: absolute; top: 40px; right: 56px; display: flex; gap: 18px; align-items: center; font-size: 34px; font-weight: 600; color: var(--soft); }
  .progress { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .dots { display: flex; gap: 8px; }
  .dots span { width: 20px; height: 20px; border-radius: 50%; background: #dfe2d8; }
  .dots span.on { background: var(--yes); }
  .sound { font: inherit; font-size: 28px; padding: 6px 18px; border-radius: 999px; border: 3px solid var(--frame); background: #fff; cursor: pointer; }
  [data-mode="record"] .sound { display: none; }

  .question { position: absolute; top: 46px; left: 300px; right: 300px; text-align: center; font-size: 66px; font-weight: 700; margin: 0; line-height: 1.15; }

  .groups { position: absolute; top: 196px; left: 0; right: 0; display: flex; justify-content: center; gap: 64px; }
  .group {
    position: relative; width: 700px; height: 470px; background: var(--group); border: 6px solid var(--groupline); border-radius: 40px;
    padding: 50px 26px 24px; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 16px;
    font: inherit; color: inherit; cursor: default; transition: border-color .3s, box-shadow .3s; -webkit-tap-highlight-color: transparent;
  }
  .playable .group { cursor: pointer; }
  .playable .group:hover { border-color: var(--frame); }
  .group.correct { border-color: var(--yes); box-shadow: 0 0 0 9px rgba(106,168,96,.3); }
  .group.shake { animation: shake .45s; }
  @keyframes shake { 20% { transform: translateX(-14px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(5px); } }

  .label {
    position: absolute; top: -36px; left: 50%; transform: translateX(-50%);
    background: var(--frame); color: #fff; font-size: 46px; font-weight: 700; padding: 4px 36px;
    border-radius: 999px; white-space: nowrap; display: flex; align-items: center; gap: 14px; min-width: 130px; justify-content: center;
  }
  .label .ic { width: 32px; height: 32px; background: #fff; }
  .label .ic.circle { border-radius: 50%; }
  .label .ic.triangle { clip-path: polygon(50% 4%, 100% 96%, 0 96%); }
  .label .dot { width: 32px; height: 32px; border-radius: 50%; border: 4px solid #fff; }
  .label.pop { animation: labelpop .5s ease; }
  @keyframes labelpop { 0% { transform: translateX(-50%) scale(.6); } 60% { transform: translateX(-50%) scale(1.12); } 100% { transform: translateX(-50%) scale(1); } }

  .card { width: 200px; height: 182px; background: var(--card); border: 10px solid var(--frame); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: none; position: relative; }
  .card svg { width: 88%; height: auto; display: block; }
  .card.small svg { width: 48%; }
  .slot { width: 200px; height: 182px; border: 5px dashed var(--frame); border-radius: 12px; opacity: .45; flex: none; }

  .newwrap { position: absolute; top: 700px; left: 0; right: 0; display: flex; justify-content: center; }
  #newCard { width: 230px; height: 210px; border-width: 12px; opacity: 0; transform: translateY(30px); transition: opacity .4s, transform .4s; z-index: 3; transform-origin: top left; }
  #newCard.in { opacity: 1; transform: none; }
  #newCard.fly { transition: transform .9s cubic-bezier(.3,.7,.25,1); }
  .tick {
    position: absolute; top: -28px; right: -28px; width: 64px; height: 64px; border-radius: 50%;
    background: var(--yes); color: #fff; font-size: 40px; font-weight: 700; border: 5px solid #fff;
    display: flex; align-items: center; justify-content: center; transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1);
  }
  .tick.show { transform: scale(1); }
  .tryagain { position: absolute; top: 770px; left: calc(50% + 180px); background: var(--no); color: #fff; font-size: 46px; font-weight: 700; padding: 10px 38px; border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .tryagain.show { opacity: 1; }

  .controls { position: absolute; bottom: 44px; left: 0; right: 0; display: flex; justify-content: center; }
  .btn { font: inherit; font-weight: 700; font-size: 46px; border: none; border-radius: 26px; padding: 16px 60px; cursor: pointer; color: #fff; background: var(--frame); box-shadow: 0 7px 0 rgba(0,0,0,.15); }
  .btn:active { transform: translateY(4px); }
  .btn[hidden] { display: none; }
  .btn.next { background: var(--yes); }

  .done { position: absolute; inset: 0; background: rgba(243,244,241,.97); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 30px; z-index: 10; }
  .done.show { display: flex; }
  .done h2 { margin: 0; font-size: 100px; }
  .done p { margin: 0 0 10px; font-size: 50px; }
</style>
</head>

function art(spec) {
  const c = COLOURS[spec.c] || COLOURS.green;
  return `<svg viewBox="0 0 200 170" aria-hidden="true"><g stroke="${OUT}" stroke-width="3" stroke-linejoin="round">${DRAW[spec.k](...c)}</g></svg>`;
}
const cardClass = spec => 'card' + (spec.size === 'small' ? ' small' : '');

// ---------------- rounds: 3 rules, 4 cards to sort in each ----------------
// side = which group the card belongs in (0 = left, 1 = right)
const ROUNDS = [
  { // 1. what it is
    groups: [
      { label: 'Fruit',       cards: [{ k: 'apple' }, { k: 'banana' }] },
      { label: 'Toy animals', cards: [{ k: 'trex', c: 'green' }, { k: 'cow' }] }

// ---------------- game ----------------
const $ = id => document.getElementById(id);
let roundIdx = 0, cardIdx = 0, order = [], phase = 'guess', soundOn = true, actx = null;

function scale() { return Math.min(innerWidth / 1920, innerHeight / 1080); }
function fit() { $('frame').style.transform = `translate(-50%, -50%) scale(${scale()})`; }
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function chime() {
  if (RECORD || !soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), s = t + i * .11;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(.16, s + .02); g.gain.exponentialRampToValueAtTime(.001, s + .7);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s + .75);
    });
  } catch (e) {}
}

const R = () => ROUNDS[roundIdx];
const current = () => R().toSort[order[cardIdx]];

function setMain(text, next = false) {
  const b = $('mainBtn');
  b.hidden = !text; b.textContent = text || ''; b.classList.toggle('next', next);
}

function updateProgress() {
  $('roundText').textContent = `Round ${roundIdx + 1} of ${ROUNDS.length}`;
  $('dots').innerHTML = R().toSort.map((_, i) => `<span class="${i < cardIdx || (i === cardIdx && phase === 'answered') ? 'on' : ''}"></span>`).join('');
}

function renderRound() {
  phase = 'guess'; cardIdx = 0;
  // children playing get the cards in a fresh order each time; the recording version keeps a fixed order for the voiceover
  order = R().toSort.map((_, i) => i);
  if (!RECORD) shuffle(order);
  $('question').textContent = 'Can you guess my sorting rule?';
  const groups = $('groups');
  groups.className = 'groups';
  groups.innerHTML = '';
  R().groups.forEach((g, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'group';
    b.setAttribute('aria-label', `Group ${i + 1}`);
    b.innerHTML = `<span class="label">?</span>` + g.cards.map(c => `<div class="${cardClass(c)}">${art(c)}</div>`).join('');
    b.addEventListener('click', () => choose(i));
    groups.appendChild(b);
  });
  hideNewCard();
  $('tryagain').classList.remove('show');
  setMain('Reveal rule');
  updateProgress();
}

function hideNewCard() {
  const nc = $('newCard');
  nc.className = 'card'; nc.style.transform = ''; nc.style.transition = 'none';
  nc.innerHTML = '';
  void nc.offsetWidth; nc.style.transition = '';
}

function reveal() {
  [...$('groups').children].forEach((el, i) => {
    const g = R().groups[i], lab = el.querySelector('.label');
    lab.innerHTML = (g.dot ? `<span class="dot" style="background:${g.dot}"></span>` : '') + (g.icon ? `<span class="ic ${g.icon}"></span>` : '') + g.label;
    lab.classList.add('pop');
    el.setAttribute('aria-label', g.label);
  });
  showCard();
}

function showCard() {
  phase = 'sorting';
  const spec = current(), nc = $('newCard');
  hideNewCard();
  nc.className = cardClass(spec);
  nc.innerHTML = art(spec) + '<div class="tick">✓</div>';
  nc.setAttribute('aria-label', spec.name);
  void nc.offsetWidth;
  nc.classList.add('in');
  // a dashed space waits in each group for the new card
  [...$('groups').children].forEach(g => { g.classList.remove('correct'); g.querySelectorAll('.tick').forEach(t => t.remove()); g.insertAdjacentHTML('beforeend', '<div class="slot"></div>'); });
  $('question').textContent = 'Where does this belong?';
  if (RECORD) setMain('Show answer');
  else { setMain(null); $('groups').classList.add('playable'); }
  updateProgress();
}

function choose(i) {
  if (RECORD || phase !== 'sorting') return;
  if (i === current().side) { settle(); return; }
  const g = $('groups').children[i];
  g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
  $('tryagain').classList.add('show');
}

function settle() {
  phase = 'answered';
  const spec = current(), side = spec.side;
  $('tryagain').classList.remove('show');
  $('groups').classList.remove('playable');
  setMain(null);
  // the other group doesn't need its space any more
  $('groups').children[1 - side].querySelector('.slot').remove();
  const g = $('groups').children[side], slot = g.querySelector('.slot'), nc = $('newCard');
  nc.style.transition = 'none'; void nc.offsetWidth;
  const a = slot.getBoundingClientRect(), b = nc.getBoundingClientRect(), s = scale();
  nc.style.transition = ''; void nc.offsetWidth;
  nc.classList.add('fly');
  nc.style.transform = `translate(${(a.left - b.left) / s}px, ${(a.top - b.top) / s}px) scale(${a.width / b.width})`;
  setTimeout(() => {
    // swap the flying card for a normal card sitting in the group
    slot.outerHTML = `<div class="${cardClass(spec)}">${art(spec)}<div class="tick show">✓</div></div>`;
    hideNewCard();
    g.classList.add('correct');
    chime();
    updateProgress();
    const lastCard = cardIdx === R().toSort.length - 1, lastRound = roundIdx === ROUNDS.length - 1;
    setMain(!lastCard ? 'Next card' : lastRound ? 'Finish' : 'Next round', true);
  }, 900);
}

function next() {
  if (cardIdx < R().toSort.length - 1) { cardIdx++; showCard(); return; }
  roundIdx++;
  if (roundIdx >= ROUNDS.length) { $('done').classList.add('show'); setMain(null); return; }
  renderRound();
}

function restart() { roundIdx = 0; $('done').classList.remove('show'); renderRound(); }

$('mainBtn').addEventListener('click', () => {
  if (phase === 'guess') reveal();
  else if (phase === 'sorting' && RECORD) settle();
  else if (phase === 'answered') next();
});
$('again').addEventListener('click', restart);
$('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  $('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  $('soundBtn').setAttribute('aria-pressed', soundOn);
});
// keyboard (handy when recording, so no mouse pointer is needed): Space / Enter / → = the big button, R = restart
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter' || k === 'arrowright') {
    e.preventDefault();
    if ($('done').classList.contains('show')) restart();
    else if (!$('mainBtn').hidden) $('mainBtn').click();
  } else if (k === 'r') restart();
});
addEventListener('resize', fit);
fit();
renderRound();
</script>
</body>
</html>
